name: CI

# Builds the mill and runs the full test path on every push and pull request:
# `dotnet test`, the libtest golden suite, and the loopback net demo. All of it
# is headless — the scribbler/turtle/plotter machine suites open a real window
# (hidden via --no-window, but real), and GitHub's hosted runners have no
# window platform for GLFW to use even under Xvfb (tried in v1.10.1; still
# failed), so those three are not part of `build.sh test` and need to be run
# by hand, locally, on a machine with a real display.

# fettler/** is ignored here for the same reason hosts/** is: it has its
# own workflow and its own suite, and it references nothing in src/. It
# needs naming separately only because it does NOT live under hosts/ —
# Fettler is not a host, it compiles nothing and runs no mill, so it sits
# at the root. Without this line every change to it would drag the whole
# mill build and test path along behind it.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'hosts/**', 'fettler/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'hosts/**', 'fettler/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The host-blindness ratchet (A3.6): no host name in the schema,
      # src/, the host-blind templates or the extension. First and
      # cheapest — the boundary is enforced here, not remembered. The
      # other verify-* scripts stay manual pre-release gates.
      - name: Host-blindness check
        run: node scripts/verify-host-blind.js

      # The one-way dependency rule (B2.2), core side: nothing in src/
      # references a hosts/ project. The hosts-side half (no Shoddy.Mill,
      # no Shoddy.Compiler on mobile) lives in maui.yml, which runs when
      # hosts/ changes; this half runs when src/ changes.
      - name: One-way dependency check
        run: |
          if grep -rE '<ProjectReference[^>]*hosts[/\\]' src --include='*.csproj'; then
            echo 'src/ must never reference hosts/ (B2.2)'; exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the mill
        run: ./build.sh build

      - name: Test — dotnet test, golden suite, net loopback
        run: ./build.sh test

  # The container proof (C8): the headless build of the mill runs a full
  # weave in a minimal Linux image with no X11 and no audio device — a
  # build that cannot reference GLFW or OpenAL cannot load them — and its
  # `run` refuses by name rather than crashing. The bare SDK image is the
  # kind of machine consumers' CI actually is, which is the reason the
  # headless build exists (C3).
  headless:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    # The headless mill runs from artifacts/bin/, where no machines/
    # directory sits beside it — so the mill-relative library discovery
    # that serves bin/mill cannot serve it. SHODDYLIB pins the checkout's
    # own machines, which is exactly what the variable exists for.
    # Without it the first weave dies chasing a seed's bare Include
    # ("cannot open machines/seeds/cuttle.shoddy") — v2.0.0 did.
    env:
      SHODDYLIB: ${{ github.workspace }}/machines
    steps:
      - uses: actions/checkout@v4

      - name: Build the headless mill
        run: dotnet build src/Shoddy.Mill.Headless -c Release

      - name: Weave a real mill, headless
        run: dotnet artifacts/bin/Shoddy.Mill.Headless/release/mill.dll weave mills/halifax/halifax.shoddy

      - name: Machine-weave its core, headless
        run: dotnet artifacts/bin/Shoddy.Mill.Headless/release/mill.dll machine mills/halifax/halifax-core.shoddy

      - name: run refuses by name
        run: |
          set +e
          out=$(dotnet artifacts/bin/Shoddy.Mill.Headless/release/mill.dll run mills/halifax/halifax.shoddy 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -eq 1
          echo "$out" | grep -q "headless"
          echo "$out" | grep -q "full mill"
