name: CI

# Builds the mill and runs the full test path on every push and pull request:
# `dotnet test`, the libtest golden suite, the loopback net demo, and the
# scribbler/turtle/plotter machine suites, which really open a window (hidden
# via --no-window, but a window all the same) and so need a display. The
# runner has none of its own, so the test step runs under Xvfb — a virtual
# X server, installed just before it is needed.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the mill
        run: ./build.sh build

      - name: Install a virtual display (Xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test — dotnet test, golden suite, net loopback
        run: xvfb-run -a ./build.sh test
