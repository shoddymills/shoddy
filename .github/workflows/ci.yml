name: CI

# Builds the mill and runs the full test path on every push and pull request:
# `dotnet test`, the libtest golden suite, and the loopback net demo. All of it
# is headless — the graphics, turtle, plotter and buzzer demos in tst/ are not
# part of `build.sh test` and need no display or audio device.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the mill
        run: ./build.sh build

      - name: Test — dotnet test, golden suite, net loopback
        run: ./build.sh test
