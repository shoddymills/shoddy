name: CI

# NO PATH FILTERS, ON PURPOSE.
#
# Every lane here used to be path-filtered - core CI ignored hosts/**, the
# MCP and MAUI lanes each had their own workflow that ran only when their
# paths changed - so a change outside a lane's paths ran none of its
# suites. Directory.Build.props, which sets the version every binary
# reports, matched no filter at all: a green push could leave most of the
# repository unproved. The local gate harness existed to paper over that
# hole, and papering over it is what kept the hole open.
#
# So now every push and every pull request is proved by everything, and CI
# is THE proof: scripts/shoddy-ship.ps1 asks GitHub for this verdict before it
# will tag a release. The counter-argument is cost - a doc typo rebuilds
# every lane for nothing - and that cost is real and small. When the
# choice is between wasting a runner and not knowing, waste the runner.
#
# Every lane reads the SDK from global.json, so the runner builds with
# the SDK the repository names, and restores in locked mode, so the
# package graph is the one the lock files record.
#
# EVERY STEP BELOW IS A BUILD VERB, never inline logic. `./build.sh prove`
# runs the same verbs on a workstation, under the same locked restore, so
# what fails here has already failed there. A check written only into this
# file is a check nobody can run before pushing - which is how a release
# used to meet its failures for the first time on the runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The cheapest job, and first: pure text, one Linux runner, no build.
  # The same list `./build.sh check` runs locally, except that
  # verify-permissions runs with --check here - a runner's index is thrown
  # away at the end of the job, so a fixing run would repair the bit,
  # exit 0, and let the fault sail through. A gate that repairs the
  # evidence is not a gate.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The docs match the sources
        run: node scripts/verify-docs.js

      - name: Every diagnostic is documented
        run: node scripts/verify-errors.js

      - name: Every script carries its executable bit
        run: node scripts/verify-permissions.js --check

      - name: The host stays blind to the mill
        run: node scripts/verify-host-blind.js

      - name: Every tst suite and mill is run or excluded
        run: node scripts/verify-suites.js

      - name: The script twins have not drifted apart
        run: node scripts/verify-twins.js

      - name: The lane boundaries hold
        run: node scripts/verify-lanes.js

      - name: The VS Code extension's debug launch logic
        run: node --test vscode-shoddy/test/launch.test.js

  # The core lane: the mill, the C# conformance suite, the golden library
  # suite, every core and machine suite, and every mill's own suite -
  # exactly what `./build.sh test` runs locally, because it IS
  # `./build.sh test`. node is needed: the build script reads the suite
  # roster out of scripts/suites.mjs.
  #
  # The scribbler/turtle/plotter suites are not here: they open a real
  # window, and GLFW has no platform to open one on on a hosted runner -
  # not even under Xvfb (tried in v1.10.1; still failed). They live in
  # scripts/shoddy-display.ps1, run by hand on a machine with a display.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the mill
        run: ./build.sh build

      # The whole suite, the manifests and the headless refusal.
      - name: Test - the whole suite
        run: ./build.sh test

      # Two clean builds of one commit must agree byte for byte.
      - name: The build is reproducible
        run: ./build.sh reproducible

  # The MCP host lane, on ubuntu deliberately: this lane has no platform
  # head, no window, no audio and no workload to install. If it ever stops
  # building on Linux something has been added that does not belong in it.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The one-way dependency rule (B2.2), hosts side: nothing under
      # hosts/ references Shoddy.Mill or Shoddy.Compiler (B2.4). The
      # weave arrives through ShoddyWeave, driven by the headless
      # toolchain, which the lane's projects build and never link.
      # verify-lanes in the checks job proves the same rule; this copy is
      # the lane's own belt-and-braces.
      - name: One-way dependency check
        run: |
          if grep -rE 'Shoddy\.Mill\.csproj|Shoddy\.Compiler\.csproj' hosts --include='*.csproj'; then
            echo 'hosts/ must not reference Shoddy.Mill or Shoddy.Compiler (B2.4)'; exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The mill's own suite first: if the FOLD is wrong there is no
      # point grading the server over it.
      - name: The sparky mill's headless suite
        run: ./build.sh test
        working-directory: mills/sparky

      - name: Build the MCP lane
        working-directory: hosts/mcp
        run: ./build.sh

      - name: Test the MCP lane
        working-directory: hosts/mcp
        run: ./build.sh test

      # release grades its own closure: no window, audio, toolchain or
      # third-party protocol package (scripts/verify-closure.js).
      - name: Release build, and its closure
        working-directory: hosts/mcp
        run: ./build.sh release

      # The archives a release attaches, cut exactly as release.yml cuts
      # them; publish then unpacks this platform's archive outside the
      # repo and drives it over stdio (scripts/verify-shipped.js).
      - name: Publish the release archives, and drive the shipped binary
        working-directory: hosts/mcp
        run: ./build.sh publish

  # The MAUI host lane (B2.5), on windows-latest - the Windows lane is a
  # CI release artifact, not a Mac dev target. Canvas and audio proofs run
  # under the desktop/device harness locally (B7.3, R4), never as a
  # hosted-runner gate: SHODDY_HEADLESS_CI tells the test suite which
  # assertions have no device here.
  maui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: One-way dependency check
        shell: pwsh
        run: |
          $bad = Get-ChildItem hosts -Recurse -Filter *.csproj | Select-String -Pattern 'Shoddy\.Mill\.csproj|Shoddy\.Compiler\.csproj'
          if ($bad) { $bad | ForEach-Object { Write-Host $_ }; Write-Error 'hosts/ must not reference Shoddy.Mill or Shoddy.Compiler (B2.4)' }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MAUI workload
        shell: pwsh
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            try {
              dotnet workload install maui-windows
              exit 0
            }
            catch {
              if ($i -eq $attempts) { throw }
              Write-Host "MAUI workload install failed; retrying in 15s ($i/$attempts)"
              Start-Sleep -Seconds 15
            }
          }

      - name: Build the MAUI lane
        working-directory: hosts/maui
        run: ./build.ps1

      - name: Test the MAUI lane
        working-directory: hosts/maui
        env:
          SHODDY_HEADLESS_CI: '1'
        run: ./build.ps1 test

      # release grades its own closure (B7.4): no perch, the woven core
      # and the machine library present (scripts/verify-closure.js).
      - name: Release build is provably clean (B7.4)
        working-directory: hosts/maui
        run: ./build.ps1 release

  # The container proof (C8): the headless build of the mill runs a full
  # weave in a minimal Linux image with no X11 and no audio device - a
  # build that cannot reference GLFW or OpenAL cannot load them - and its
  # `run` refuses by name rather than crashing. The bare SDK image is the
  # kind of machine consumers' CI actually is, which is the reason the
  # headless build exists (C3).
  headless:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    # The headless mill carries no machine library and no sources: it
    # is the build tool, and a project tells it what to link. At a
    # command line the two variables do the same: SHODDYLIB names the
    # sources an Include resolves against, SHODDYLIBBIN the compiled
    # libraries - here the seeds project's output, which carries the
    # library it references beside its own.
    env:
      SHODDYLIB: ${{ github.workspace }}/machines
      SHODDYLIBBIN: ${{ github.workspace }}/artifacts/bin/Shoddy.Machines.Seeds/release
    steps:
      - uses: actions/checkout@v4

      - name: Build the headless mill and the machine library
        run: dotnet build machines/seeds/Shoddy.Machines.Seeds.csproj -c Release

      - name: Weave a real mill, headless
        run: dotnet artifacts/bin/Shoddy.Mill.Headless/release/mill.dll weave mills/halifax/halifax.shoddy -o artifacts/headless

      - name: Machine-weave its core, headless
        run: dotnet artifacts/bin/Shoddy.Mill.Headless/release/mill.dll machine mills/halifax/halifax-core.shoddy -o artifacts/headless

      - name: run refuses by name
        run: |
          set +e
          out=$(dotnet artifacts/bin/Shoddy.Mill.Headless/release/mill.dll run mills/halifax/halifax.shoddy 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -eq 1
          echo "$out" | grep -q "headless"
          echo "$out" | grep -q "full mill"
