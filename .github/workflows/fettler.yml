name: Fettler

# Fettler's own CI, path-filtered to fettler/**.
#
# Fettler is NOT a host and does not live under hosts/. A host carries a
# woven mill into some other kind of application; Fettler compiles
# nothing, runs no mill, and references nothing in src/ (R1.2), so it
# sits at the repository root beside machines/ and mills/ rather than
# inside a folder describing something it is not.
#
# That placement is why ci.yml names fettler/** in its paths-ignore
# alongside hosts/**: without it, every change here would drag the whole
# mill build and test path along behind it for no reason.
#
# windows-latest AND macos-latest, both required and neither the
# reference platform (R9.1). Several tests in R10 cannot execute on one
# of them at all - a POSIX execute bit, an APFS case-only rename, a
# decomposed filename, an NTFS alternate data stream - so a green run on
# one platform is only half the proof. They are attributed with the
# platform they need and print the reason they skipped, because a skip
# nobody can see is a test that quietly stopped existing.
#
# ubuntu carries the independence check only: it is the cheapest runner
# and the check is pure text.

# Directory.Build.props and global.json are named because this lane is
# BUILT from them and matched none of the filters that reached it. The
# props file sets the version fettle reports; global.json sets the SDK it
# compiles against. A change to either could break or mis-stamp this lane
# with no workflow here ever running - and the local gate did not run the
# suite either, so nothing at all would have noticed.
on:
  push:
    branches: [main]
    paths: ['fettler/**', 'NOTICE', 'Directory.Build.props', 'global.json',
            '.github/workflows/fettler.yml']
  pull_request:
    paths: ['fettler/**', 'NOTICE', 'Directory.Build.props', 'global.json',
            '.github/workflows/fettler.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # R1.2 and R1.4, from outside the code as well as from inside it. The
  # test in Fettler.Tests reads the built assemblies' references; this
  # reads the project files, so a reference added and not yet built is
  # caught in the same push that adds it.
  independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No project reference leaves the lane
        run: |
          if grep -rE '<ProjectReference[^>]*Include="[^"]*\.\.[/\\]\.\.[/\\]' \
               fettler --include='*.csproj'; then
            echo 'fettler must not reference any project outside its own lane (R1.2)'
            exit 1
          fi

      # R1.2, package side, narrowed to what its reason supports. The rule
      # was "no package at all", and its stated reason was that Fettler
      # shares this repository and nothing else - which bans a
      # ProjectReference absolutely and does not, on its own, ban every
      # third-party package.
      #
      # So: an ALLOWLIST, checked here as an exact set. A package added to
      # the csproj and not to this list fails the push that added it, which
      # makes widening the rule a deliberate act rather than a drift. Every
      # entry must be permissively licensed, pure managed with no native
      # assets (fettle publishes self-contained and single-file), minimal in
      # its transitive closure, and maintained.
      - name: Only allowlisted packages ride along in what ships
        run: |
          allowed='PdfPig'
          found=$(grep -hoE '<PackageReference Include="[^"]+"' \
                    fettler/Fettler/Fettler.csproj fettler/fettle/fettle.csproj \
                  | sed -E 's/.*Include="([^"]+)".*/\1/' | sort -u)
          for pkg in $found; do
            echo "$allowed" | tr ' ' '\n' | grep -qx "$pkg" || {
              echo "fettler/ takes $pkg, which is not on R1.2's allowlist"
              echo "adding one is a decision: put it in this list, in the csproj comment,"
              echo "in FrontEndTests.Allowed, in THIRD-PARTY-NOTICES.md, and in"
              echo "NOTICE if its licence asks - NOTICE is what reaches a downloader"
              exit 1
            }
          done
          echo "packages: ${found:-none}"

      # Two obligations travel with a distributed binary. Apache-2.0 wants
      # the licence and any NOTICE alongside it, because fettle bundles
      # PdfPig into the single file it ships; MIT wants Shoddy's own
      # copyright notice in every copy, and an archive is a copy. Either
      # one left behind in the repository has not reached the person who
      # downloaded a release.
      #
      # The scope sentence is checked too. PdfPig is in fettle and in
      # nothing else built here, and a NOTICE that stopped saying so would
      # describe the extension and sparky as carrying a PDF component
      # neither has ever had.
      - name: The notice and the licence travel with the binary
        run: |
          grep -q 'PdfPig' NOTICE || { echo 'NOTICE does not mention PdfPig'; exit 1; }
          grep -q 'fettle alone' NOTICE || {
            echo 'NOTICE no longer scopes PdfPig to fettle alone'; exit 1; }
          for f in fettler/build.ps1 fettler/build.sh; do
            grep -q 'NOTICE'  "$f" || { echo "$f does not put NOTICE in the archive";  exit 1; }
            grep -q 'LICENSE' "$f" || { echo "$f does not put LICENSE in the archive"; exit 1; }
          done


      # This was a grep for each verb in each file. It passed on the word
      # appearing ANYWHERE, a comment included, and it covered this one lane
      # out of six pairs in the tree - so it could not have caught either of
      # the drifts that were actually here: tutorials/spiro shipping a .sh
      # with no .ps1 at all, and ship taking -Yes in PowerShell against -y in
      # the shell while the docs called them interchangeable.
      #
      # verify-twins.js pairs every .ps1 with its .sh across the whole tree
      # and compares the usage blocks. It walks the filesystem rather than
      # the git index, so a twin that has just been written is visible to it.
      - name: The script twins have not drifted apart
        run: node scripts/verify-twins.js

  lane:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The root global.json is a FLOOR (rollForward: latestMinor), so
      # whatever 10.x the runner installs satisfies it. This lane has no
      # workload to pair with an exact SDK, as the MAUI lane does.

      - name: Build the lane
        working-directory: fettler
        run: dotnet build Fettler.slnx -c Release

      # R9.3: the hazards each have a test rather than a comment, and the
      # tests run on both platforms. The skip list is printed so a
      # platform-specific test that stopped running is visible.
      - name: Test the lane
        working-directory: fettler
        run: dotnet test Fettler.Tests -c Release --logger "console;verbosity=normal"

      # R2.5: drive the built binary end to end on every push, so the
      # shipped artefact cannot rot between releases. This is the
      # published single-file executable, not a dotnet run.
      - name: Publish the single-file executable
        working-directory: fettler
        run: dotnet publish fettle -c Release --self-contained -p:PublishSingleFile=true -o published

      - name: Drive it (unix)
        if: runner.os != 'Windows'
        working-directory: fettler
        run: |
          set -euo pipefail
          exe=./published/fettle
          mkdir -p smoke/src && printf 'public sealed class A\n' > smoke/src/A.cs

          "$exe" --root smoke find '**/*.cs' --json
          "$exe" --root smoke search '^public sealed' --glob '**/*.cs' --json
          "$exe" --root smoke read src/A.cs --json

          # R3.7: a failure arrives complete on STDOUT, and reading it
          # must not need a stderr redirection anywhere.
          out=$("$exe" --root smoke read absent.cs --json) && code=0 || code=$?
          echo "$out" | grep -q '"outcome":"not-found"' || { echo "expected not-found on stdout"; exit 1; }
          [ "$code" = "3" ] || { echo "expected exit 3, got $code"; exit 1; }

          # --root grants list read and can NEVER grant more, at any
          # level, with no override. So a write through one is refused,
          # and asserting that is the point: this step used to ask --root
          # for the execute bit and read the documented refusal as a
          # broken build.
          out=$("$exe" --root smoke exec src/A.cs --on --json) && code=0 || code=$?
          [ "$code" = "8" ] || { echo "expected --root to refuse a write with exit 8, got $code: $out"; exit 1; }

          # To write to a tree you put a file in it. Paths in it resolve
          # against the file's own directory, so "." is smoke/ wherever
          # this runs from.
          printf '%s\n' '{"trees":{"smoke":{"path":".","can":["list","read","create","update","rename","delete"]}}}' > smoke/.fettler.json

          # R6.9: the bit this whole clause is about, on the platform
          # that has one.
          "$exe" --config smoke/.fettler.json exec src/A.cs --on --json
          [ -x smoke/src/A.cs ] || { echo "exec --on did not set the executable bit"; exit 1; }

      - name: Drive it (windows)
        if: runner.os == 'Windows'
        working-directory: fettler
        shell: pwsh
        run: |
          # fettle answers with an exit code, and a non-zero one is an
          # ANSWER rather than a failure - asserting them is this step's
          # whole job. GitHub sets $ErrorActionPreference='stop' for its
          # pwsh shell, and pwsh 7.4 turns a native command's non-zero
          # exit into a TERMINATING error under it. So `read absent.cs`,
          # whose entire point is to come back 3, killed the step before
          # the line that checks for 3 ever ran.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $exe = './published/fettle.exe'
          New-Item -ItemType Directory -Force smoke/src | Out-Null
          Set-Content smoke/src/A.cs "public sealed class A" -Encoding utf8

          & $exe --root smoke find '**/*.cs' --json
          & $exe --root smoke search '^public sealed' --glob '**/*.cs' --json
          & $exe --root smoke read src/A.cs --json

          # R3.7 is a clause because of THIS shell: Windows PowerShell
          # turns a native program's redirected stderr into
          # NativeCommandError records and sets $? false even on exit 0.
          # Reading the answer must therefore need no redirection at all.
          Write-Host "pwsh $($PSVersionTable.PSVersion); EAP=$ErrorActionPreference; native=$PSNativeCommandUseErrorActionPreference"

          $out = & $exe --root smoke read absent.cs --json
          $code = $LASTEXITCODE
          Write-Host "read absent.cs -> code=$code out=$out"
          if ($code -ne 3) { Write-Host "expected exit 3, got $code"; exit 1 }
          if ($out -notmatch '"outcome":"not-found"') { Write-Host "expected not-found on stdout, got: $out"; exit 1 }

          # --root grants list read and can never grant more, whatever
          # the verb. The unix lane asserts the same thing through exec.
          $refused = & $exe --root smoke write src/B.cs --text 'public sealed class B' --json
          $code = $LASTEXITCODE
          Write-Host "root write -> code=$code out=$refused"
          if ($code -ne 8) { Write-Host "expected --root to refuse a write with exit 8, got $code"; exit 1 }

          # Every assertion above passed, and the LAST thing this step ran
          # was a command that answered 8 on purpose. GitHub's pwsh wrapper
          # ends with `exit $LASTEXITCODE`, so without this the step fails
          # carrying the exit code of an assertion that SUCCEEDED.
          exit 0

      # R3.2: the MCP front end speaks on stdio, and stdout carries the
      # protocol and nothing else. One initialize is enough to prove the
      # binary starts, answers, and stops when stdin closes.
      - name: Drive the MCP front end (unix)
        if: runner.os != 'Windows'
        working-directory: fettler
        run: |
          set -euo pipefail
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            | ./published/fettle serve --root smoke > reply.json
          grep -q '"serverInfo"' reply.json || { echo "no serverInfo in: $(cat reply.json)"; exit 1; }
          head -c 1 reply.json | grep -q '{' || { echo "stdout did not start with the message"; exit 1; }

      - name: Drive the MCP front end (windows)
        if: runner.os == 'Windows'
        working-directory: fettler
        shell: pwsh
        run: |
          $request = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
          $reply = $request | & ./published/fettle.exe serve --root smoke
          if ($reply -notmatch '"serverInfo"') { throw "no serverInfo in: $reply" }
