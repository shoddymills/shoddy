name: MAUI

# The host lane's CI (B2.5): separate from core CI, path-filtered to
# hosts/maui/**, building on windows-latest — the Windows lane is a CI
# release artifact, not a Mac dev target (rollout §3). Canvas and audio
# proofs run under the desktop/device harness locally (B7.3, R4), never
# as a hosted-runner gate: SHODDY_HEADLESS_CI tells the test suite
# which assertions have no device here.

# Directory.Build.props and global.json are named because this lane is
# BUILT from them and matched neither filter. global.json matters more here
# than anywhere else: this lane reads it directly, because the MAUI workload
# has to pair with the SDK it was tested against.
on:
  push:
    branches: [main]
    paths: ['hosts/maui/**', 'Directory.Build.props', 'global.json',
            '.github/workflows/maui.yml']
  pull_request:
    paths: ['hosts/maui/**', 'Directory.Build.props', 'global.json',
            '.github/workflows/maui.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The one-way dependency rule (B2.2), hosts side: nothing under
      # hosts/ references Shoddy.Mill (B2.4 — Shoddy.Mill.Headless is a
      # different project and is reached as a tool, not a reference),
      # and no mobile-targeting project references Shoddy.Compiler.
      - name: One-way dependency check
        shell: pwsh
        run: |
          $bad = Get-ChildItem hosts -Recurse -Filter *.csproj | Select-String -Pattern 'Shoddy\.Mill\.csproj|Shoddy\.Compiler\.csproj'
          if ($bad) { $bad | ForEach-Object { Write-Host $_ }; Write-Error 'hosts/ must not reference Shoddy.Mill or Shoddy.Compiler (B2.4)' }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Publish the mill (ShoddyWeave drives it)
        run: dotnet publish src/Shoddy.Mill -c Release -o bin

      - name: Build the MAUI lane
        working-directory: hosts/maui
        run: ./build.ps1

      - name: Test the MAUI lane
        working-directory: hosts/maui
        env:
          SHODDY_HEADLESS_CI: '1'
        run: ./build.ps1 test

      - name: Release build is provably clean (B7.4)
        working-directory: hosts/maui
        run: ./build.ps1 release

      - name: Assert no perch in the release output (B7.4)
        shell: pwsh
        run: |
          $rel = 'artifacts/bin/ShoddyReckoner/release_net10.0-windows10.0.19041.0'
          if (Test-Path "$rel/Shoddy.Perch.dll") { Write-Error 'release output carries the debug transport (B7.4)' }
          if (-not (Test-Path "$rel/Shoddy.Machines.Halifax-core.dll")) { Write-Error 'release output is missing the woven core' }
