name: Deploy docs to Pages

# Regenerates docs/sitemap.xml (lastmod from git commit dates) and publishes
# docs/ as the Pages site. Requires the repo's Pages source to be set to
# "GitHub Actions" (Settings > Pages); the generated sitemap is a deploy
# artifact and is never committed.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/make-sitemap.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — sitemap lastmod comes from git log
      - name: Regenerate sitemap
        run: sh .github/scripts/make-sitemap.sh docs https://shoddymills.github.io/shoddy/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
