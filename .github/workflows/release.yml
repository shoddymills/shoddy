name: Release

# Pushing a tag is what ships. scripts/shoddy-ship.ps1 creates and pushes it (after
# refusing anything unproven); this builds from the tag on a clean runner
# and publishes the GitHub Release with the packaged extension and the
# sparky binaries attached. Neither the .vsix nor a binary is ever
# committed - this is the only place a shipped package comes from.
#
# THE TAG IS THE VERSION. Nothing in the repository records a release
# number: Directory.Build.props and vscode-shoddy/package.json carry
# development defaults, and the steps below stamp both from the tag on
# this runner, uncommitted. So there is no version-bump commit to make, no
# release branch to cut, and nothing to merge back afterwards - the
# sequence that used to need a documented recovery procedure for when it
# died halfway through.
#
# The staged mill is framework-dependent and carries every RID's natives
# (see build.sh `stage`), so a package built here on Linux is the same
# artifact as one built on Windows. The unix sparky archives are cut on
# hosts/mcp's publish, on this Linux runner, which is load-bearing: the
# executable bit only survives a tar made on a filesystem that has one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (X.Y.Z) - does not publish a release'
        required: true

permissions:
  contents: write
  deployments: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and all tags: composing the notes needs to find
          # the previous tag and log the changes between it and this one.
          fetch-depth: 0

      # The tag is the single source of the version, so it is worth being
      # strict about: anything that is not an exact X.Y.Z would end up
      # stamped into a binary and printed on an archive.
      - name: Read the version from the tag
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version='${{ github.event.inputs.version }}'
            tag="v$version"
          else
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "the tag '$tag' does not carry an exact X.Y.Z version"; exit 1; }
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $tag"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install vsce
        run: npm install -g @vscode/vsce

      # RUNNER-LOCAL AND NEVER COMMITTED. Every binary this repository
      # builds reads its version from Directory.Build.props, and the
      # extension packages at package.json's version; stamping both here
      # from the tag is what makes the tag the single source. A locally
      # built mill reports the development default, which is honest - a
      # local build is not a release.
      - name: Stamp the version from the tag
        run: |
          sed -i "s#<Version>[0-9][0-9.]*</Version>#<Version>${{ steps.ver.outputs.version }}</Version>#" Directory.Build.props
          grep -q "<Version>${{ steps.ver.outputs.version }}</Version>" Directory.Build.props || {
            echo 'Directory.Build.props did not take the version stamp'; exit 1; }
          cd vscode-shoddy
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      # The whole toolchain from nothing: clean, the entire test surface
      # (the C# suite, every core and machine suite, every mill), then
      # stage and package the extension. A red test stops everything with
      # nothing published.
      - name: Build, test, package
        run: ./build.sh all

      - name: Confirm the package was produced
        run: test -f "vscode-shoddy/vscode-shoddy-${{ steps.ver.outputs.version }}.vsix"

      # The MCP lane ships beside the extension: sparky as a
      # self-contained single-file binary per OS, so a user needs
      # nothing but the download and an MCP client - no repo, no .NET
      # install. Its server tests run first; there is no point attaching
      # a binary the fold or the protocol would fail. `./build.sh all`
      # above already staged bin/mill, which ShoddyWeave drives.
      - name: Test the MCP lane
        working-directory: hosts/mcp
        run: ./build.sh test

      - name: Publish sparky binaries
        working-directory: hosts/mcp
        run: ./build.sh publish ${{ steps.ver.outputs.version }}

      # The executable bit only survives a tar made on a filesystem that
      # has one; an archive cut on Windows cannot record it at all, and a
      # sparky that arrives without it does not run.
      - name: The published sparky must be executable
        run: |
          tar -tvzf artifacts/publish/sparky-${{ steps.ver.outputs.version }}-linux-x64.tar.gz \
            | grep -q '^-rwx' || {
              echo 'the linux archive carries sparky without its execute bit'; exit 1; }

      # Hand-written notes win. scripts/shoddy-ship.ps1 refuses to tag without
      # them, so the fallback here is for a tag pushed by hand: never
      # empty, and never worth linking to.
      - name: Compose release notes
        run: |
          TAG='${{ steps.ver.outputs.tag }}'
          if [ -f "release-notes/$TAG.md" ]; then
            echo "Using checked-in notes: release-notes/$TAG.md"
            cp "release-notes/$TAG.md" NOTES.md
          else
            echo "::warning::No release-notes/$TAG.md in the tagged commit; generating from history."
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
            {
              echo '## Changes'
              echo
              git log --no-merges --format='- %s' "$RANGE" || echo '- Maintenance release.'
              if [ -n "$PREV" ]; then
                echo
                echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$PREV...$TAG"
              fi
            } > NOTES.md
          fi
          echo '--- release body ---'
          cat NOTES.md

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "vscode-shoddy/vscode-shoddy-${{ steps.ver.outputs.version }}.vsix" \
            artifacts/publish/sparky-* \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file NOTES.md

      # The repo home's Deployments sidebar is where a passer-by sees what
      # this repository puts into the world - Pages lists the docs site
      # there. This records sparky beside it, an environment whose latest
      # deployment links the release its binaries live on. required_contexts
      # is emptied because the tag build IS the gate; asking the deployment
      # to wait on status checks would deadlock a job that is itself the
      # only check.
      - name: Record the sparky deployment
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/deployments" \
            -f ref="${{ steps.ver.outputs.tag }}" -f environment=sparky \
            -f description="sparky - the reckoner as an MCP server, one self-contained executable per OS" \
            -F auto_merge=false -f "required_contexts[]" --jq .id)
          gh api "repos/${{ github.repository }}/deployments/$id/statuses" \
            -f state=success \
            -f environment_url="https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}" \
            -f description="${{ steps.ver.outputs.tag }}"
