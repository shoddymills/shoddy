<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100" role="img" aria-label="A tapered transmitting mast on the moor, broadcasting">
  <rect width="160" height="100" fill="#171a20"/>

  <!-- the moor -->
  <path d="M0 88 C 26 84, 44 90, 66 87 S 108 82, 132 86 S 152 88, 160 87 L 160 100 L 0 100 Z" fill="#2a2f27"/>
  <path d="M0 88 C 26 84, 44 90, 66 87 S 108 82, 132 86 S 152 88, 160 87" fill="none" stroke="#55604a" stroke-width="2"/>

  <!-- broadcast: three arcs each side, the signal going out -->
  <g fill="none" stroke="#5fa8de" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M64 24 a 18 18 0 0 0 0 20"/>
    <path d="M56 19 a 26 26 0 0 0 0 30"/>
    <path d="M48 14 a 34 34 0 0 0 0 40"/>
    <path d="M96 24 a 18 18 0 0 1 0 20"/>
    <path d="M104 19 a 26 26 0 0 1 0 30"/>
    <path d="M112 14 a 34 34 0 0 1 0 40"/>
  </g>

  <!-- the tower: a tapered concrete shaft, wider at the base -->
  <path d="M74 88 L 77 40 L 83 40 L 86 88 Z" fill="#9aa3b2"/>
  <path d="M74 88 L 77 40 L 80 40 L 80 88 Z" fill="#c3cad6"/>

  <!-- the aerial galleries -->
  <rect x="70" y="46" width="20" height="4" fill="#2f4560"/>
  <rect x="72" y="57" width="16" height="3" fill="#2f4560"/>

  <!-- the lattice mast above the concrete -->
  <line x1="80" y1="40" x2="80" y2="14" stroke="#d9a066" stroke-width="2"/>
  <path d="M77 36 l6 -4 M77 32 l6 -4 M77 28 l6 -4 M77 24 l6 -4 M77 20 l6 -4"
        stroke="#d9a066" stroke-width="1.5" fill="none"/>
  <circle cx="80" cy="11" r="3" fill="#d9a066"/>
</svg>
