<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A terminal showing the labelled stack rows of an RPN calculator above a traced cascade, each nested row stepped one indent further right">
  <rect width="320" height="200" fill="#12151b"/>
  <rect width="320" height="22" fill="#1c2129"/>
  <circle cx="14" cy="11" r="4" fill="#d9534f"/>
  <circle cx="28" cy="11" r="4" fill="#d9a066"/>
  <circle cx="42" cy="11" r="4" fill="#7ec699"/>

  <!-- the prompt, and the line that was typed at it -->
  <path d="M18 40 l6 4 -6 4" fill="none" stroke="#7ec699" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#9aa3b2">
    <rect x="32" y="41" width="14" height="5" rx="2"/>
    <rect x="52" y="41" width="8" height="5" rx="2"/>
    <rect x="66" y="41" width="34" height="5" rx="2"/>
    <rect x="106" y="41" width="8" height="5" rx="2"/>
  </g>

  <!-- the stack, deepest first, x nearest the prompt -->
  <g>
    <rect x="18" y="60" width="12" height="5" rx="2" fill="#5f6b7c"/>
    <rect x="36" y="60" width="26" height="5" rx="2" fill="#d9a066"/>
    <rect x="18" y="74" width="12" height="5" rx="2" fill="#5f6b7c"/>
    <rect x="36" y="74" width="18" height="5" rx="2" fill="#d9a066"/>
    <rect x="18" y="88" width="12" height="5" rx="2" fill="#5fa8de"/>
    <rect x="36" y="88" width="44" height="5" rx="2" fill="#d9a066"/>
  </g>

  <!-- the trace: one row per token, the marker column holding while the
       indent steps in, because a nested row is a different stack -->
  <g>
    <rect x="18" y="112" width="18" height="5" rx="2" fill="#9aa3b2"/>
    <rect x="86" y="111" width="2" height="7" fill="#5f6b7c"/>
    <rect x="96" y="112" width="20" height="5" rx="2" fill="#d9a066"/>

    <rect x="18" y="126" width="24" height="5" rx="2" fill="#5fa8de"/>
    <rect x="86" y="125" width="2" height="7" fill="#5fa8de"/>
    <rect x="96" y="126" width="46" height="5" rx="2" fill="#5f6b7c"/>

    <rect x="30" y="140" width="20" height="5" rx="2" fill="#9aa3b2"/>
    <rect x="86" y="139" width="2" height="7" fill="#5f6b7c"/>
    <rect x="96" y="140" width="34" height="5" rx="2" fill="#d9a066"/>

    <rect x="30" y="154" width="10" height="5" rx="2" fill="#9aa3b2"/>
    <rect x="86" y="153" width="2" height="7" fill="#5f6b7c"/>
    <rect x="96" y="154" width="22" height="5" rx="2" fill="#d9a066"/>

    <rect x="18" y="168" width="24" height="5" rx="2" fill="#5fa8de"/>
    <rect x="86" y="167" width="2" height="7" fill="#5fa8de"/>
    <rect x="96" y="168" width="28" height="5" rx="2" fill="#d9a066"/>
  </g>
</svg>
