<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A terminal showing the labelled stack rows of an RPN calculator above a traced cascade, each nested row stepped one indent further right">
  <rect width="320" height="200" fill="#12151b"/>
  <rect width="320" height="22" fill="#1c2129"/>
  <circle cx="14" cy="11" r="4" fill="#d9534f"/>
  <circle cx="28" cy="11" r="4" fill="#d9a066"/>
  <circle cx="42" cy="11" r="4" fill="#7ec699"/>

  <!-- the prompt, and the line that was typed at it -->
  <path d="M18 40 l6 4 -6 4" fill="none" stroke="#7ec699" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#9aa3b2">
    <rect x="34" y="41" width="30" height="5" rx="2"/>
    <rect x="72" y="41" width="16" height="5" rx="2"/>
    <rect x="96" y="41" width="72" height="5" rx="2"/>
    <rect x="176" y="41" width="16" height="5" rx="2"/>
  </g>

  <!-- the stack, deepest first, x nearest the prompt -->
  <g>
    <rect x="18" y="60" width="24" height="5" rx="2" fill="#5f6b7c"/>
    <rect x="52" y="60" width="56" height="5" rx="2" fill="#d9a066"/>
    <rect x="18" y="74" width="24" height="5" rx="2" fill="#5f6b7c"/>
    <rect x="52" y="74" width="38" height="5" rx="2" fill="#d9a066"/>
    <rect x="18" y="88" width="24" height="5" rx="2" fill="#5fa8de"/>
    <rect x="52" y="88" width="94" height="5" rx="2" fill="#d9a066"/>
  </g>

  <!-- the trace: one row per token, the marker column holding while the
       indent steps in, because a nested row is a different stack -->
  <g>
    <rect x="18" y="112" width="40" height="5" rx="2" fill="#9aa3b2"/>
    <rect x="176" y="111" width="2" height="7" fill="#5f6b7c"/>
    <rect x="192" y="112" width="44" height="5" rx="2" fill="#d9a066"/>

    <rect x="18" y="126" width="52" height="5" rx="2" fill="#5fa8de"/>
    <rect x="176" y="125" width="2" height="7" fill="#5fa8de"/>
    <rect x="192" y="126" width="100" height="5" rx="2" fill="#5f6b7c"/>

    <rect x="42" y="140" width="44" height="5" rx="2" fill="#9aa3b2"/>
    <rect x="176" y="139" width="2" height="7" fill="#5f6b7c"/>
    <rect x="192" y="140" width="74" height="5" rx="2" fill="#d9a066"/>

    <rect x="42" y="154" width="22" height="5" rx="2" fill="#9aa3b2"/>
    <rect x="176" y="153" width="2" height="7" fill="#5f6b7c"/>
    <rect x="192" y="154" width="48" height="5" rx="2" fill="#d9a066"/>

    <rect x="18" y="168" width="52" height="5" rx="2" fill="#5fa8de"/>
    <rect x="176" y="167" width="2" height="7" fill="#5fa8de"/>
    <rect x="192" y="168" width="62" height="5" rx="2" fill="#d9a066"/>
  </g>
</svg>
