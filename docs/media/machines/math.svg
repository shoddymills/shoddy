<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100" role="img" aria-label="math — Clamp and Lerp">
  <rect width="160" height="100" fill="#171a20"/>
  <rect width="160" height="18" fill="#1e222b"/>
  <text x="9" y="12.5" fill="#d9a066" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="0.6">math</text>
  <text x="9" y="39" fill="#cdd6df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5">Clamp(42, 0, 10)</text>
  <text x="9" y="53" fill="#7fb99a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5">→ 10</text>
  <text x="9" y="67" fill="#cdd6df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5">Lerp(0, 10, 0.25)</text>
  <text x="9" y="81" fill="#7fb99a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5">→ 2.5</text>
</svg>
