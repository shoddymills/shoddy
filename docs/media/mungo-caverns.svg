<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Mungo Caverns in a terminal: the well house, a brass lamp, and the prompt">
  <defs>
    <radialGradient id="lamp" cx="0.78" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#e8a94a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e8a94a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="#0a0805"/>
  <rect width="320" height="200" fill="url(#lamp)"/>
  <text x="16" y="32" fill="#f0b95c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.4">MUNGO CAVERNS</text>
  <line x1="16" y1="44" x2="304" y2="44" stroke="#6b4620"/>
  <text x="16" y="68" fill="#ffd79a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">&gt; in</text>
  <text x="16" y="90" fill="#c79a5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">You are inside a building, a</text>
  <text x="16" y="104" fill="#c79a5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">well house for a large spring.</text>
  <text x="16" y="126" fill="#c79a5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">There is a shiny brass lamp</text>
  <text x="16" y="140" fill="#c79a5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">nearby.</text>
  <text x="16" y="164" fill="#ffd79a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">&gt; take lamp</text>
  <text x="16" y="184" fill="#c79a5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">OK</text>
  <rect x="35" y="175" width="7" height="12" fill="#f0b95c" opacity="0.85"/>
</svg>
