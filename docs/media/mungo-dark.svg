<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A turn of Mungo Caverns in the dark: PLUGH, pitch dark, lighting the lamp, and a curmudgeon barring the way">
  <rect width="320" height="200" fill="#08070a"/>
  <text x="16" y="24" fill="#9fd8c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">&gt; plugh</text>
  <text x="16" y="42" fill="#e8dcc4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">&gt;&gt;Foof!&lt;&lt;</text>
  <text x="16" y="62" fill="#8e8a82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">It is now pitch dark.  If you</text>
  <text x="16" y="76" fill="#8e8a82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">proceed you will likely fall</text>
  <text x="16" y="90" fill="#8e8a82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">into a pit.</text>
  <text x="16" y="112" fill="#9fd8c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">&gt; light lamp</text>
  <text x="16" y="132" fill="#f0b95c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Your lamp is now on.</text>
  <text x="16" y="154" fill="#c9c2b4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">A little curmudgeon with a big</text>
  <text x="16" y="168" fill="#c9c2b4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">knife blocks your way.</text>
  <text x="16" y="190" fill="#9fd8c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">&gt;</text>
  <rect x="26" y="181" width="7" height="11" fill="#9fd8c0" opacity="0.8"/>
</svg>
