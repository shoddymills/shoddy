<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Diagram: the rule modules return what they say on the Game record, the turn loop decides when it is printed, and test.shoddy drives the rules with no terminal">
  <rect width="320" height="200" fill="#0d1016"/>

  <rect x="14" y="16" width="292" height="72" rx="6" fill="#131a24" stroke="#2f6b52"/>
  <text x="26" y="36" fill="#9fd8c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">the rules &#183; 19 namespaced modules</text>
  <text x="26" y="54" fill="#8e9aa8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">travel, curmudgeons, pirate, hints,</text>
  <text x="26" y="67" fill="#8e9aa8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">clock, closing, scoring, the verbs</text>
  <text x="26" y="82" fill="#d79a5b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">Game -&gt; Game.  They return what they say.</text>

  <line x1="104" y1="88" x2="104" y2="118" stroke="#3d4756"/>
  <path d="M104 124 l-5 -8 h10 z" fill="#3d4756"/>
  <text x="112" y="108" fill="#7fb3d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">Output As List Of String</text>

  <rect x="14" y="126" width="180" height="58" rx="6" fill="#131a24" stroke="#8a5a2b"/>
  <text x="26" y="146" fill="#f0b95c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">the turn loop</text>
  <text x="26" y="162" fill="#8e9aa8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">Flushed &#183; Utter &#183; Input</text>
  <text x="26" y="176" fill="#8e9aa8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">where the effects live</text>

  <rect x="200" y="126" width="106" height="58" rx="6" fill="#131a24" stroke="#3d4756" stroke-dasharray="3 3"/>
  <text x="208" y="146" fill="#9fd8c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">test.shoddy</text>
  <text x="208" y="162" fill="#8e9aa8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">drives the rules</text>
  <text x="208" y="175" fill="#8e9aa8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">with no terminal</text>

  <path d="M253 88 v30" stroke="#3d4756" fill="none" stroke-dasharray="3 3"/>
  <path d="M253 126 l-5 -8 h10 z" fill="#3d4756"/>
</svg>
