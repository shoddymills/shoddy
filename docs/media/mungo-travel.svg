  <rect x="0" y="0" width="320" height="20" fill="#141922"/>
  <text x="12" y="14" fill="#7b8494" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">mungo-caverns-travel.shoddy</text>

  <text x="12" y="38" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><tspan fill="#d79a5b">Type</tspan><tspan fill="#7fb3d8"> TravelCond</tspan><tspan fill="#c9c5bd"> =</tspan></text>
  <text x="12" y="52" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><tspan fill="#c9c5bd">      Always</tspan></text>
  <text x="12" y="66" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><tspan fill="#c9c5bd">    | Chance(Percent </tspan><tspan fill="#d79a5b">As</tspan><tspan fill="#7fb3d8"> Number</tspan><tspan fill="#c9c5bd">)</tspan></text>
  <text x="12" y="80" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><tspan fill="#c9c5bd">    | Carrying(Obj </tspan><tspan fill="#d79a5b">As</tspan><tspan fill="#7fb3d8"> Number</tspan><tspan fill="#c9c5bd">)</tspan></text>

  <text x="12" y="104" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><tspan fill="#c9c5bd">Op(</tspan><tspan fill="#8fbf9f">30</tspan><tspan fill="#c9c5bd">, Carrying(</tspan><tspan fill="#8fbf9f">50</tspan><tspan fill="#c9c5bd">), ToRoom(</tspan><tspan fill="#8fbf9f">20</tspan><tspan fill="#c9c5bd">), ...)</tspan></text>
  <text x="12" y="118" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><tspan fill="#6f6a62">Rem DOWN -&gt; goto LOC_NECKBROKE</tspan></text>

  <line x1="12" y1="132" x2="308" y2="132" stroke="#242b36"/>

  <text x="12" y="150" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><tspan fill="#d79a5b">Select Case</tspan><tspan fill="#c9c5bd"> Condition(o)</tspan></text>
  <text x="12" y="164" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><tspan fill="#c9c5bd">    </tspan><tspan fill="#d79a5b">Case</tspan><tspan fill="#c9c5bd"> Carrying(obj)</tspan></text>
  <text x="12" y="178" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><tspan fill="#c9c5bd">        Toting(g, obj)</tspan></text>
  <text x="12" y="192" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"><tspan fill="#c9c5bd">    </tspan><tspan fill="#d79a5b">Case</tspan><tspan fill="#c9c5bd"> Chance(pct)</tspan><tspan fill="#6f6a62">   Rem a draw</tspan></text>
