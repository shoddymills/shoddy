<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="One woven assembly feeding three hosts: a terminal, an app window, and the cloud">
  <rect width="320" height="200" fill="#12151b"/>

  <!-- the woven assembly: one card, its words as bars -->
  <rect x="22" y="70" width="86" height="60" rx="6" fill="#1c2129" stroke="#5f6b7c" stroke-width="2"/>
  <g fill="#d9a066">
    <rect x="34" y="84" width="44" height="5" rx="2"/>
    <rect x="34" y="98" width="60" height="5" rx="2"/>
    <rect x="34" y="112" width="32" height="5" rx="2"/>
  </g>

  <!-- one source, three destinations -->
  <g stroke="#5f6b7c" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M112 84 C 142 66, 158 50, 184 42"/>
    <path d="M112 100 L 184 100"/>
    <path d="M112 116 C 142 134, 158 150, 184 158"/>
  </g>
  <g fill="#5f6b7c">
    <path d="M184 42 l-9 -2 3 6 z"/>
    <path d="M184 100 l-9 -4 0 8 z"/>
    <path d="M184 158 l-9 2 3 -6 z"/>
  </g>

  <!-- the terminal -->
  <rect x="196" y="20" width="102" height="48" rx="5" fill="#12151b" stroke="#1c2129" stroke-width="3"/>
  <circle cx="206" cy="29" r="2.6" fill="#d9534f"/>
  <circle cx="215" cy="29" r="2.6" fill="#d9a066"/>
  <circle cx="224" cy="29" r="2.6" fill="#7ec699"/>
  <path d="M206 45 l5 3.5 -5 3.5" fill="none" stroke="#7ec699" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="218" y="46" width="38" height="4" rx="2" fill="#9aa3b2"/>
  <rect x="218" y="56" width="56" height="4" rx="2" fill="#5f6b7c"/>

  <!-- the app window -->
  <rect x="196" y="78" width="102" height="46" rx="5" fill="#151a22" stroke="#1c2129" stroke-width="3"/>
  <rect x="196" y="78" width="102" height="12" rx="5" fill="#1c2129"/>
  <path d="M286 82 l4 4 M290 82 l-4 4" stroke="#9aa3b2" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="206" y="98" width="20" height="4" rx="2" fill="#5f6b7c"/>
  <rect x="232" y="98" width="40" height="4" rx="2" fill="#d9a066"/>
  <rect x="206" y="110" width="20" height="4" rx="2" fill="#5fa8de"/>
  <rect x="232" y="110" width="54" height="4" rx="2" fill="#d9a066"/>

  <!-- the cloud -->
  <path d="M216 178 a11 11 0 0 1 5 -21 a15 15 0 0 1 29 -5 a12 12 0 0 1 12 21 z"
        fill="none" stroke="#5fa8de" stroke-width="3" stroke-linejoin="round"/>
  <rect x="272" y="164" width="24" height="4" rx="2" fill="#5f6b7c"/>
  <rect x="272" y="174" width="16" height="4" rx="2" fill="#5f6b7c"/>
</svg>
