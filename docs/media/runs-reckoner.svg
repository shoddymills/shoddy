<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="The Shoddy Reckoner app window: the calculator's labelled stack rows above a shelf of three game cards">
  <rect width="320" height="200" fill="#151a22"/>
  <rect width="320" height="22" fill="#1c2129"/>
  <!-- app window controls, right-handed -->
  <rect x="266" y="10" width="10" height="2.5" rx="1" fill="#9aa3b2"/>
  <rect x="284" y="7" width="9" height="9" rx="1.5" fill="none" stroke="#9aa3b2" stroke-width="2"/>
  <path d="M303 7 l9 9 M312 7 l-9 9" stroke="#9aa3b2" stroke-width="2" stroke-linecap="round"/>

  <!-- the calculator: labelled stack rows, values in amber -->
  <g>
    <rect x="20" y="38" width="24" height="5" rx="2" fill="#5f6b7c"/>
    <rect x="54" y="38" width="52" height="5" rx="2" fill="#d9a066"/>
    <rect x="20" y="52" width="24" height="5" rx="2" fill="#5f6b7c"/>
    <rect x="54" y="52" width="34" height="5" rx="2" fill="#d9a066"/>
    <rect x="20" y="66" width="24" height="5" rx="2" fill="#5fa8de"/>
    <rect x="54" y="66" width="88" height="5" rx="2" fill="#d9a066"/>
  </g>
  <!-- the entry line the platform owns -->
  <rect x="20" y="84" width="280" height="16" rx="4" fill="none" stroke="#5f6b7c" stroke-width="2"/>
  <rect x="28" y="89" width="46" height="5" rx="2" fill="#9aa3b2"/>
  <rect x="80" y="87" width="2" height="10" fill="#7ec699"/>

  <!-- the games shelf: three cards, three seams -->
  <g>
    <rect x="20" y="116" width="84" height="64" rx="6" fill="#12151b" stroke="#1c2129" stroke-width="2"/>
    <path d="M62 140 a12 12 0 1 1 -0.01 0 Z M62 140 L76 134 L76 146 Z" fill="#f2d24a"/>
    <circle cx="44" cy="166" r="2.5" fill="#f2d24a"/><circle cx="58" cy="166" r="2.5" fill="#f2d24a"/>
    <circle cx="72" cy="166" r="2.5" fill="#f2d24a"/>

    <rect x="118" y="116" width="84" height="64" rx="6" fill="#12151b" stroke="#1c2129" stroke-width="2"/>
    <path d="M146 138 a14 14 0 0 1 28 0 v22 l-5.6 -5.6 -5.6 5.6 -5.6 -5.6 -5.6 5.6 z" fill="#22d0d0"/>
    <circle cx="153" cy="140" r="2.6" fill="#12151b"/>
    <circle cx="167" cy="140" r="2.6" fill="#12151b"/>
    <rect x="142" y="168" width="36" height="4" rx="2" fill="#7ec699"/>

    <rect x="216" y="116" width="84" height="64" rx="6" fill="#12151b" stroke="#1c2129" stroke-width="2"/>
    <g fill="#9aa3b2">
      <rect x="226" y="128" width="52" height="4" rx="2"/>
      <rect x="226" y="140" width="64" height="4" rx="2"/>
      <rect x="226" y="152" width="40" height="4" rx="2"/>
    </g>
    <path d="M226 166 l5 3.5 -5 3.5" fill="none" stroke="#7ec699" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="238" y="167" width="30" height="4" rx="2" fill="#d9a066"/>
  </g>
</svg>
