<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A woven mill running at a terminal: maze walls, dots, and Pac mid-game under the window's title bar">
  <rect width="320" height="200" fill="#12151b"/>
  <rect width="320" height="22" fill="#1c2129"/>
  <circle cx="14" cy="11" r="4" fill="#d9534f"/>
  <circle cx="28" cy="11" r="4" fill="#d9a066"/>
  <circle cx="42" cy="11" r="4" fill="#7ec699"/>

  <!-- the command that started it -->
  <path d="M18 40 l6 4 -6 4" fill="none" stroke="#7ec699" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#9aa3b2">
    <rect x="34" y="41" width="26" height="5" rx="2"/>
    <rect x="68" y="41" width="20" height="5" rx="2"/>
    <rect x="96" y="41" width="58" height="5" rx="2"/>
  </g>

  <!-- the game it became: walls, dots, Pac, a ghost -->
  <g stroke="#2b6de0" stroke-width="5" fill="none">
    <rect x="26" y="62" width="112" height="38" rx="5"/>
    <rect x="182" y="62" width="112" height="38" rx="5"/>
    <rect x="26" y="126" width="70" height="48" rx="5"/>
    <rect x="224" y="126" width="70" height="48" rx="5"/>
  </g>
  <g fill="#f2d24a">
    <circle cx="160" cy="81" r="3"/><circle cx="160" cy="113" r="3"/>
    <circle cx="136" cy="113" r="3"/><circle cx="184" cy="113" r="3"/>
    <circle cx="112" cy="113" r="3"/><circle cx="208" cy="113" r="3"/>
  </g>
  <path d="M160 150 a15 15 0 1 1 -0.01 0 Z M160 150 L177 143 L177 157 Z" fill="#f2d24a"/>
  <path d="M196 141 a14 14 0 0 1 28 0 v24 l-5.6 -5.6 -5.6 5.6 -5.6 -5.6 -5.6 5.6 z" fill="#22d0d0"/>
  <circle cx="203" cy="143" r="2.6" fill="#12151b"/>
  <circle cx="217" cy="143" r="2.6" fill="#12151b"/>
</svg>
