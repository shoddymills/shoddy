<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A question asked in English on the left, and on the right the calculator's answer: labelled stack rows above a small histogram">
  <rect width="320" height="200" fill="#12151b"/>
  <rect width="320" height="22" fill="#1c2129"/>
  <circle cx="14" cy="11" r="4" fill="#d9534f"/>
  <circle cx="28" cy="11" r="4" fill="#d9a066"/>
  <circle cx="42" cy="11" r="4" fill="#7ec699"/>

  <!-- the question, asked in English: a bubble with a tail, because the
       caller here is not typing at a prompt -->
  <g>
    <rect x="16" y="44" width="116" height="58" rx="8" fill="#1c2129"/>
    <path d="M30 102 l0 12 12 -12 z" fill="#1c2129"/>
    <g fill="#9aa3b2">
      <rect x="28" y="58" width="60" height="5" rx="2"/>
      <rect x="94" y="58" width="26" height="5" rx="2"/>
      <rect x="28" y="72" width="34" height="5" rx="2"/>
      <rect x="68" y="72" width="52" height="5" rx="2"/>
      <rect x="28" y="86" width="44" height="5" rx="2"/>
    </g>
  </g>

  <!-- the crossing: one line of JSON-RPC each way, on stdin and stdout -->
  <g stroke="#7ec699" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M140 66 l14 0"/>
    <path d="M150 62 l5 4 -5 4"/>
  </g>
  <g stroke="#5fa8de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M154 86 l-14 0"/>
    <path d="M144 82 l-5 4 5 4"/>
  </g>

  <!-- the answer: the stack, rendered exactly as the calculator renders
       it, label then value -->
  <g>
    <rect x="166" y="44" width="16" height="5" rx="2" fill="#5f6b7c"/>
    <rect x="190" y="44" width="52" height="5" rx="2" fill="#d9a066"/>
    <rect x="166" y="58" width="16" height="5" rx="2" fill="#5f6b7c"/>
    <rect x="190" y="58" width="34" height="5" rx="2" fill="#d9a066"/>
    <rect x="166" y="72" width="16" height="5" rx="2" fill="#5fa8de"/>
    <rect x="190" y="72" width="76" height="5" rx="2" fill="#d9a066"/>
  </g>

  <!-- and the chart it drew, blitted back in the same answer -->
  <g>
    <rect x="166" y="96" width="140" height="80" rx="3" fill="#1c2129"/>
    <g fill="#5fa8de">
      <rect x="178" y="146" width="16" height="22"/>
      <rect x="200" y="128" width="16" height="40"/>
      <rect x="222" y="112" width="16" height="56"/>
      <rect x="244" y="134" width="16" height="34"/>
      <rect x="266" y="152" width="16" height="16"/>
    </g>
    <rect x="174" y="168" width="124" height="2" fill="#5f6b7c"/>
  </g>
</svg>
