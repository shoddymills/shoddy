<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A spec file on the left, and the scatter plot with its regression line that the spec produces on the right">
  <rect width="320" height="200" fill="#12151b"/>
  <rect width="320" height="22" fill="#1c2129"/>
  <circle cx="14" cy="11" r="4" fill="#d9534f"/>
  <circle cx="28" cy="11" r="4" fill="#d9a066"/>
  <circle cx="42" cy="11" r="4" fill="#7ec699"/>

  <!-- the spec file: a comment, then key = value lines -->
  <g fill="#5f6b7c">
    <rect x="16" y="38" width="70" height="4" rx="2"/>
  </g>
  <g>
    <rect x="16" y="54" width="44" height="4" rx="2" fill="#d9a066"/>
    <rect x="64" y="54" width="6" height="4" rx="2" fill="#5f6b7c"/>
    <rect x="74" y="54" width="52" height="4" rx="2" fill="#7ec699"/>

    <rect x="16" y="68" width="52" height="4" rx="2" fill="#d9a066"/>
    <rect x="72" y="68" width="6" height="4" rx="2" fill="#5f6b7c"/>
    <rect x="82" y="68" width="34" height="4" rx="2" fill="#7ec699"/>

    <rect x="16" y="82" width="38" height="4" rx="2" fill="#d9a066"/>
    <rect x="58" y="82" width="6" height="4" rx="2" fill="#5f6b7c"/>
    <rect x="68" y="82" width="46" height="4" rx="2" fill="#7ec699"/>

    <rect x="16" y="96" width="48" height="4" rx="2" fill="#d9a066"/>
    <rect x="68" y="96" width="6" height="4" rx="2" fill="#5f6b7c"/>
    <rect x="78" y="96" width="28" height="4" rx="2" fill="#7ec699"/>

    <rect x="16" y="110" width="42" height="4" rx="2" fill="#d9a066"/>
    <rect x="62" y="110" width="6" height="4" rx="2" fill="#5f6b7c"/>
    <rect x="72" y="110" width="56" height="4" rx="2" fill="#7ec699"/>
  </g>
  <!-- the report, ruled off underneath -->
  <path d="M16 128 H128" stroke="#2b3240" stroke-width="2"/>
  <g fill="#9aa3b2">
    <rect x="16" y="138" width="26" height="4" rx="2"/>
    <rect x="52" y="138" width="34" height="4" rx="2"/>
    <rect x="96" y="138" width="32" height="4" rx="2"/>
    <rect x="16" y="150" width="26" height="4" rx="2"/>
    <rect x="52" y="150" width="34" height="4" rx="2"/>
    <rect x="96" y="150" width="32" height="4" rx="2"/>
    <rect x="16" y="162" width="26" height="4" rx="2"/>
    <rect x="52" y="162" width="34" height="4" rx="2"/>
    <rect x="96" y="162" width="32" height="4" rx="2"/>
  </g>

  <!-- the chart it produces -->
  <rect x="152" y="34" width="152" height="134" fill="#f7f8fa"/>
  <path d="M170 152 H292 M170 152 V48" stroke="#171a20" stroke-width="2.5" fill="none"/>
  <path d="M172 146 L288 62" stroke="#d9534f" stroke-width="2"/>
  <g fill="#1f77b4">
    <circle cx="182" cy="142" r="3.5"/>
    <circle cx="200" cy="136" r="3.5"/>
    <circle cx="214" cy="118" r="3.5"/>
    <circle cx="228" cy="112" r="3.5"/>
    <circle cx="240" cy="96" r="3.5"/>
    <circle cx="252" cy="94" r="3.5"/>
    <circle cx="264" cy="74" r="3.5"/>
