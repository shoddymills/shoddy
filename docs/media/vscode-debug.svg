<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Debugging invaders in VS Code — stopped at the collision-scoring line, inspecting hits and score">
  <rect width="320" height="200" fill="#1e1e1e"/>
  <!-- title / tab bar -->
  <rect width="320" height="17" fill="#252526"/>
  <rect x="0" y="17" width="150" height="1" fill="#1e1e1e"/>
  <rect x="0" y="0" width="150" height="18" fill="#1e1e1e"/>
  <circle cx="10" cy="9" r="3" fill="#e0b24a"/>
  <text x="18" y="12" fill="#d4d4d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5">invaders-core.shoddy</text>
  <text x="150" y="12" fill="#6a9955" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5">DEBUG · Shoddy</text>

  <!-- current-line highlight (debugger stopped) -->
  <rect x="0" y="86" width="196" height="15" fill="#4d431c"/>
  <rect x="0" y="86" width="2" height="15" fill="#e0b24a"/>
  <!-- breakpoint + stop arrow in gutter -->
  <circle cx="9" cy="93.5" r="3.4" fill="#e51400"/>

  <!-- line numbers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#6e7681" text-anchor="end">
    <text x="21" y="35">104</text><text x="21" y="50">105</text><text x="21" y="65">106</text>
    <text x="21" y="79">107</text><text x="21" y="96">108</text><text x="21" y="111">109</text><text x="21" y="126">110</text>
  </g>

  <!-- code -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5">
    <text x="27" y="35"><tspan fill="#569cd6">Def </tspan><tspan fill="#dcdcaa">Collide</tspan><tspan fill="#d4d4d4">(g </tspan><tspan fill="#569cd6">As </tspan><tspan fill="#4ec9b0">Game</tspan><tspan fill="#d4d4d4">) </tspan><tspan fill="#569cd6">As </tspan><tspan fill="#4ec9b0">Game</tspan></text>
    <text x="27" y="50"><tspan fill="#569cd6">  Let </tspan><tspan fill="#9cdcfe">liveAliens </tspan><tspan fill="#d4d4d4">= </tspan><tspan fill="#dcdcaa">Filter</tspan><tspan fill="#d4d4d4">(Aliens(g), …)</tspan></text>
    <text x="27" y="65"><tspan fill="#569cd6">  Let </tspan><tspan fill="#9cdcfe">liveLasers </tspan><tspan fill="#d4d4d4">= </tspan><tspan fill="#dcdcaa">Filter</tspan><tspan fill="#d4d4d4">(Lasers(g), …)</tspan></text>
    <text x="27" y="79"><tspan fill="#569cd6">  Let </tspan><tspan fill="#9cdcfe">hits </tspan><tspan fill="#d4d4d4">= </tspan><tspan fill="#dcdcaa">Length</tspan><tspan fill="#d4d4d4">(Aliens(g)) </tspan><tspan fill="#d4d4d4">- </tspan><tspan fill="#dcdcaa">Length</tspan><tspan fill="#d4d4d4">(…)</tspan></text>
    <text x="27" y="96"><tspan fill="#dcdcaa">  With</tspan><tspan fill="#d4d4d4">(g, Aliens = </tspan><tspan fill="#9cdcfe">liveAliens</tspan><tspan fill="#d4d4d4">,</tspan></text>
    <text x="27" y="111"><tspan fill="#d4d4d4">          Score = </tspan><tspan fill="#dcdcaa">Score</tspan><tspan fill="#d4d4d4">(g) + </tspan><tspan fill="#9cdcfe">hits</tspan><tspan fill="#d4d4d4">)</tspan></text>
  </g>

  <!-- debug side panel -->
  <rect x="197" y="17" width="123" height="183" fill="#252526"/>
  <rect x="197" y="17" width="1" height="183" fill="#1a1a1a"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="205" y="33" fill="#bfbfbf" font-size="7.5" letter-spacing="0.7">VARIABLES</text>
    <text x="205" y="50" font-size="8"><tspan fill="#9cdcfe">g</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#4ec9b0">Game</tspan></text>
    <text x="205" y="65" font-size="8"><tspan fill="#9cdcfe">aliens</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#b5cea8">5</tspan></text>
    <text x="205" y="80" font-size="8"><tspan fill="#9cdcfe">liveAliens</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#b5cea8">2</tspan></text>
    <rect x="199" y="86" width="119" height="14" fill="#04395e"/>
    <text x="205" y="96" font-size="8"><tspan fill="#9cdcfe">hits</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#b5cea8">3</tspan></text>
    <text x="205" y="111" font-size="8"><tspan fill="#9cdcfe">score</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#b5cea8">240</tspan></text>
    <text x="205" y="138" fill="#bfbfbf" font-size="7.5" letter-spacing="0.7">CALL STACK</text>
    <text x="205" y="154" font-size="8"><tspan fill="#e0b24a">▸ </tspan><tspan fill="#d4d4d4">Collide</tspan></text>
    <text x="205" y="168" font-size="8" fill="#8c8c8c">  Advance</text>
    <text x="205" y="182" font-size="8" fill="#8c8c8c">  Loop</text>
  </g>
</svg>
